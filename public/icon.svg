<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="128" fill="#0a0a0a"/>
  <!-- Multi-tool / Swiss Army Knife Icon -->
  <g transform="translate(48, 48) scale(0.8125)" stroke="#ffffff" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Blade -->
    <path d="M 120 280 L 70 120 C 60 70 140 40 180 120 L 190 280 Z" fill="#121212" stroke="#6366f1" stroke-width="16" />
    <!-- Scissors blade 1 -->
    <path d="M 220 260 L 260 80 M 260 80 A 18 18 0 1 1 290 90 L 235 270" stroke="#a5b4fc" stroke-width="14" />
    <circle cx="275" cy="85" r="12" fill="#0a0a0a" stroke="#a5b4fc" stroke-width="8" />
    <!-- Scissors blade 2 -->
    <path d="M 210 260 L 180 90 M 180 90 A 18 18 0 1 0 150 100 L 195 270" stroke="#a5b4fc" stroke-width="14" />
    <circle cx="165" cy="95" r="12" fill="#0a0a0a" stroke="#a5b4fc" stroke-width="8" />
    <!-- Corkscrew spiral -->
    <path d="M 280 380 Q 320 400 300 420 Q 270 440 320 450 Q 360 460 340 475" stroke="#818cf8" stroke-width="14" />
    <!-- Main Handle Body -->
    <rect x="130" y="240" width="220" height="150" rx="75" fill="#1a1c23" stroke="#4f46e5" stroke-width="20" />
    <circle cx="180" cy="315" r="24" fill="#0a0a0a" stroke="#a5b4fc" stroke-width="12" />
    <circle cx="300" cy="315" r="16" fill="#0a0a0a" stroke="#a5b4fc" stroke-width="10" />
    <!-- Small Keyring loop -->
    <circle cx="365" cy="315" r="14" fill="none" stroke="#6366f1" stroke-width="10" />
  </g>
</svg>
